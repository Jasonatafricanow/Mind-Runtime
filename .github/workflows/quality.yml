name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LCE_BASELINE_SHA: f6a4bc8164a65e69845444a7b697f8a1af0cd626

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/check_ruff_baseline.py
      - name: Enforce mypy no-regression baseline
        run: python scripts/check_mypy_baseline.py

  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - name: Smoke-test declared runtime dependencies
        run: |
          python -c "import fastapi, uvicorn, psutil, dateutil"
          python -c "import mind_runtime; import observation_window.web.api; import observation_window.web.server"

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Install optional current LCE for covered integration tests
        run: >-
          python -m pip install
          "git+https://github.com/Jasonatafricanow/LCE-Longitudinal-Cognition-Engine.git@${LCE_BASELINE_SHA}"
      - name: Install paired MR-Mem for covered host integration
        run: python -m pip install 'git+https://github.com/Jasonatafricanow/MR-Mem.git@3aa8f74d50c7aa53ba7cc074054004b4e9e3eb79'
      - run: python -m coverage run -m pytest tests xiyue/tests -q
      - run: python -m coverage report --show-missing

