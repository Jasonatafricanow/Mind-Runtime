name: semantic-delta-host
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  host-composition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]' ruff
      - name: Install exact MR-Mem assembly baseline
        # Publish this paired MR-Mem revision before running the remote MR job.
        run: python -m pip install 'git+https://github.com/Jasonatafricanow/MR-Mem.git@a73ab444d07d4e4769868183fe07e4b47951ba95'
      - run: python -m ruff check xiyue/semantic_delta_*.py xiyue/apply_semantic_delta_patch.py xiyue/tests
      - run: python -m pytest -q xiyue/tests -p no:cacheprovider
