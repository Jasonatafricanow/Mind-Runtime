<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MR 观察窗 — 交互时间线</title>
<link rel="stylesheet" href="/static/style.css">\n<script src="/static/display_zh.js"></script>
</head>
<body class="theme-dark">

<div id="nav">
  <span id="nav-title">MR OBSERVATION</span>
  <a href="/" class="nav-link">状态</a>
  <a href="/timeline" class="nav-link active">时间线</a>
  <a href="/causal" class="nav-link">因果</a>
  <a href="/history" class="nav-link">历史</a>
  <a href="/live-trace" class="nav-link">实时链路</a>
  <span id="live-badge">在线</span>
</div>

<div class="card">
  <div class="card-title">最近轮次（最新优先 · 在线）</div>
  <div style="margin-bottom:8px">
    <label class="dim" style="font-size:11px">筛选：
      <select id="filter-comp" style="margin-left:4px">
        <option value="">全部</option>
        <option value="ON">开启</option>
        <option value="OFF">关闭</option>
      </select>
    </label>
  </div>
  <div id="turns-list">
    <div class="empty">正在加载…</div>
  </div>
</div>

<script>
const API = '';
let pollTimer = null;
let cache = [];

async function load() {
  try {
    const r = await fetch(API + '/api/turns?limit=50');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    cache = data.turns || [];
    render();
    document.getElementById('live-badge').className = '';
  } catch (e) {
    document.getElementById('live-badge').className = 'disconnected';
    document.getElementById('live-badge').textContent = '已断开';
  }
}

function render() {
  const comp = document.getElementById('filter-comp').value;
  const list = cache.filter(t => !comp || t.composition === comp);
  const el = document.getElementById('turns-list');
  if (list.length === 0) {
    el.innerHTML = '<div class="empty">暂无轮次</div>';
    return;
  }
  el.innerHTML = list.map(t => {
    const compCls = t.composition === 'ON' ? 'comp-ON' : 'comp-OFF';
    const dimSummary = (t.changed_dimensions || []).map(d => {
      const sign = d.delta >= 0 ? '+' : '';
      return `<span class="dim" title="${esc(d.dimension)}">${esc(OWDisplay.shortDimension(d.dimension))} ${sign}${d.delta.toFixed(3)}</span>`;
    }).join(' · ');
    const decisions = `${t.applied}/${t.decisions} 已应用`;
    return `<div class="turn-row" onclick="openTurn('${esc(t.interaction_id)}')">
      <div>
        <span class="turn-ts">${formatTs(t.created_at)}</span>
        <span class="turn-comp ${compCls}" title="${esc(t.composition)}">${esc(OWDisplay.displayStatus(t.composition))}</span>
        <span class="mono" style="font-size:11px; color:var(--dim)">ix:${esc(t.interaction_id)}</span>
      </div>
      <div class="dim">decisions: ${decisions}${t.abstained > 0 ? ` &nbsp; <span class="badge badge-abstained">abstained: ${t.abstained}</span>` : ''}</div>
      <div class="turn-dims">${dimSummary || '<span class="dim">（无维度变化）</span>'}</div>
    </div>`;
  }).join('');
}

async function openTurn(interactionId) {
  try {
    const r = await fetch(API + '/api/turns/' + encodeURIComponent(interactionId));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    showModal(data.turn);
  } catch (e) {
    alert('Failed to load turn: ' + e.message);
  }
}

function showModal(turn) {
  const decisions = (turn.decisions || []).map(d => {
    const cls = d.applied ? 'badge-applied' : 'badge-abstained';
    const lbl = d.applied ? 'APPLIED' : 'ABSTAINED';
    return `<tr>
      <td>${d.decision_index}</td>
      <td><span class="badge ${cls}">${lbl}</span></td>
      <td class="mono">${esc(d.rule_id)}</td>
      <td class="mono">${esc(d.appraisal_id)}</td>
      <td class="mono" title="${esc(d.reason_code || d.abstention_reason || '—')}">${esc(OWDisplay.displayReason(d.reason_code || d.abstention_reason || '—'))}</td>
      <td class="mono dim">${esc(d.source_ref || '')}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="6" class="dim">无决策</td></tr>';
  const appraisals = (turn.appraisals || []).map(a =>
    `<tr><td class="mono">${esc(a.appraisal_id)}</td>
        <td class="polarity-${esc(a.polarity || 'neutral')}">${esc(a.polarity || '?')}</td>
        <td class="dim">${esc(a.authority)}</td>
        <td class="dim" title="${esc(a.causal_status)}">${esc(OWDisplay.displayCode(a.causal_status))}</td>
        <td>${a.provider_confidence?.toFixed(3) ?? '—'}</td>
    </tr>`).join('') || '<tr><td colspan="5" class="dim">无评估</td></tr>';
  const contribs = (turn.contributions || []).map(c =>
    `<tr><td class="mono" title="${esc(c.dimension)}">${esc(OWDisplay.shortDimension(c.dimension))}</td>
        <td class="dim" title="${esc(c.source_kind)}">${esc(OWDisplay.displayCode(c.source_kind))}</td>
        <td>${(c.amount >= 0 ? '+' : '') + c.amount.toFixed(3)}</td>
        <td>${c.confidence.toFixed(3)}</td>
        <td class="mono dim">${esc(c.source_ref || '')}</td>
    </tr>`).join('') || '<tr><td colspan="5" class="dim">无贡献</td></tr>';
  const dims = Object.entries(turn.state_after || {}).map(([dim, after]) => {
    const before = (turn.state_before || {})[dim] ?? 0;
    const delta = after - before;
    if (Math.abs(delta) < 1e-9) return null;
    const cls = delta > 0 ? 'delta-positive' : 'delta-negative';
    return `<tr><td class="mono">${esc(dim)}</td>
        <td>${before.toFixed(3)}</td>
        <td>${after.toFixed(3)}</td>
        <td class="${cls}">${(delta >= 0 ? '+' : '') + delta.toFixed(3)}</td>
    </tr>`;
  }).filter(Boolean).join('') || '<tr><td colspan="4" class="dim">无状态变化</td></tr>';
  const abst = (turn.abstention_reasons || []).length
    ? `<div class="dim mt8"><b>abstention_reasons:</b> ${(turn.abstention_reasons || []).map(esc).join(', ')}</div>` : '';
  const html = `
    <div style="position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100; padding:24px; overflow:auto">
      <div style="background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:20px; max-width:1000px; margin:0 auto">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px">
          <h2 style="font-family:var(--mono); font-size:14px; color:var(--accent)">TURN ${esc(turn.interaction_id)}</h2>
          <button onclick="this.closest('[style*=fixed]').remove()" style="background:var(--border); color:var(--text); border:none; padding:4px 10px; border-radius:4px; cursor:pointer">×</button>
        </div>
        <div class="dim mb8">
          <span class="turn-comp ${turn.composition === 'ON' ? 'comp-ON' : 'comp-OFF'}" title="${esc(turn.composition)}">${esc(OWDisplay.displayStatus(turn.composition))}</span>
          &nbsp; trace: <span class="mono">${esc(turn.trace_id)}</span> &nbsp;
          &nbsp; created: ${esc(String(turn.created_at))}
        </div>
        <div class="card">
          <div class="card-title">评估</div>
          <table>
            <thead><tr><th>ID</th><th>极性</th><th>权威级别</th><th>因果状态</th><th>置信度</th></tr></thead>
            <tbody>${appraisals}</tbody>
          </table>
        </div>
        <div class="card">
          <div class="card-title">Decisions</div>
          <table>
            <thead><tr><th>#</th><th>已应用</th><th>规则 ID</th><th>评估 ID</th><th>原因</th><th>来源引用</th></tr></thead>
            <tbody>${decisions}</tbody>
          </table>
        </div>
        <div class="card">
          <div class="card-title">Contributions</div>
          <table>
            <thead><tr><th>维度</th><th>来源类型</th><th>贡献量</th><th>置信度</th><th>来源引用</th></tr></thead>
            <tbody>${contribs}</tbody>
          </table>
        </div>
        <div class="card">
          <div class="card-title">状态变化</div>
          <table>
            <thead><tr><th>维度</th><th>变化前</th><th>变化后</th><th>变化量</th></tr></thead>
            <tbody>${dims}</tbody>
          </table>
        </div>
        ${abst}
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}

function formatTs(s) {
  if (!s) return '—';
  try { return new Date(s).toLocaleString(); } catch (_) { return s; }
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.getElementById('filter-comp').addEventListener('change', render);
load();
pollTimer = setInterval(load, 1500);
window.addEventListener('pagehide', () => { if (pollTimer) clearInterval(pollTimer); });
window.addEventListener('beforeunload', () => { if (pollTimer) clearInterval(pollTimer); });
window.addEventListener('pageshow', (e) => { if (e.persisted) { load(); pollTimer = setInterval(load, 1500); } });
</script>
</body>
</html>
