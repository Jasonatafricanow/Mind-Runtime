<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MR Observation — Moments</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/display_zh.js"></script>
<script src="/static/runtime_scope.js"></script>
<script src="/static/runtime_selector.js"></script>
<style>
.feed-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.filter-group {
  display: flex;
  align-items: center;
  gap: 8px;
}
.badge-delta {
  background: var(--yellow-soft);
  color: var(--yellow);
  font-family: var(--body);
  font-size: 10.5px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 4px;
}
.badge-slow {
  background: var(--purple-soft);
  color: var(--purple);
  font-family: var(--body);
  font-size: 10.5px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 4px;
}
.badge-no-delta {
  background: transparent;
  color: var(--dim);
  border: 1px solid var(--border);
  font-family: var(--mono);
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 3px;
}
</style>
</head>
<body>
<div class="layout">
  <!-- Unified Navigation Bar -->
  <div id="nav">
    <span id="nav-title">MR Observation</span>
    <span id="runtime-indicator" class="runtime-indicator" style="display:none; font-family:var(--mono); font-size:11px; padding:2px 8px; border-radius:4px; background:#1c2738; color:var(--accent); border:1px solid #23482d; margin-left:8px;"></span>
    <div id="runtime-selector" class="runtime-selector" role="group"></div>
    <a href="/" class="nav-link">状态</a>
    <a href="/moments" class="nav-link active">交互</a>
    <div class="nav-dropdown">
      <button class="nav-dropdown-toggle">调试 ▾</button>
      <div class="nav-dropdown-menu">
        <a href="/debug/causal" class="nav-dropdown-item">因果检查器</a>
        <a href="/debug/ledger" class="nav-dropdown-item">状态台账</a>
        <a href="/debug/live-trace" class="nav-dropdown-item">实时链路</a>
      </div>
    </div>
    <div style="margin-left:auto; display:flex; align-items:center; gap:10px;">
      <button id="btn-refresh" class="btn" class="btn-refresh" style="background:var(--surface); border:1px solid var(--border); color:var(--text-secondary); font-family:var(--body); font-size:12px; font-weight:500; padding:4px 12px; border-radius:6px; cursor:pointer;" onclick="manualRefresh()">⟳<span class="hide-narrow"> 刷新</span></button>
      <span class="conn-dot ok" id="dot" style="display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--green);"></span>
      <span class="mono dim" id="status-text" style="font-size:11px;">live</span>
      <span class="mono dim" id="clock" style="font-size:11px; margin-left:4px;">--:--:--</span>
      <span id="live-badge">LIVE</span>
    </div>
  </div>

  <div class="feed-header">
    <div>
      <div class="card-title" style="margin-bottom:2px; font-size:13px; color:var(--accent);">交互记录</div>
      <div class="mono dim" style="font-size:11px;">已提交交互的确定性记录：包含状态变化或认知事件。</div>
    </div>
    <div class="mono dim" style="font-size:11px;">
      显示 <span id="visible-count" style="color:var(--text); font-weight:600;">0</span> / 已加载 <span id="total-loaded" style="color:var(--text);">0</span> 条
    </div>
  </div>

  <!-- User-Controlled Client-Side Filter Bar -->
  <div class="filter-bar">
    <div class="filter-group">
      <span class="mono dim" style="font-size:11px;">筛选：</span>
      <button class="filter-pill active" id="btn-filter-all" onclick="setFilterMode('all')">全部</button>
      <button class="filter-pill" id="btn-filter-changes" onclick="setFilterMode('changes')">有变化（|Δ| &gt; 0）</button>
      <button class="filter-pill" id="btn-filter-major" onclick="setFilterMode('major')">Δ ≥ 0.05</button>
      <button class="filter-pill" id="btn-filter-semantic" onclick="setFilterMode('semantic')">语义事件</button>
      <button class="filter-pill" id="btn-filter-slow" onclick="setFilterMode('slow')">慢状态写入</button>
      <button class="filter-pill" id="btn-filter-aborted" onclick="setFilterMode('aborted')">已中止</button>
    </div>

    <div class="filter-group" style="margin-left:auto;">
      <label class="mono dim" style="font-size:11px; display:flex; align-items:center; gap:6px;">
        <span>最小 |Δ|：</span>
        <input type="number" id="threshold-input" min="0" max="1" step="0.01" value="0.00" style="width:65px; font-family:var(--mono);" oninput="onThresholdChange(this.value)" />
      </label>
    </div>
  </div>

  <!-- Moments Feed List -->
  <div id="moments-list">
    <div class="empty">正在加载交互记录…</div>
  </div>

  <!-- Pagination / Load More -->
  <div style="text-align:center; margin:16px 0;" id="pagination-box">
    <button id="btn-load-more" class="btn" style="background:var(--surface); border:1px solid var(--border); color:var(--text-secondary); font-family:var(--body); font-size:13px; font-weight:500; padding:7px 18px; border-radius:7px; cursor:pointer;" onclick="loadMore()">加载更多 ↓</button>
  </div>
</div>

<script>
const runtimeSelection = OWRuntimeScope.parsePageRuntime(window.location.search);
OWRuntimeScope.propagateNavigation(runtimeSelection);
OWRuntimeScope.renderRuntimeIndicator(document.getElementById("runtime-indicator"), runtimeSelection);
OWRuntimeSelector.bootstrap(runtimeSelection);

let isPageActive = true;
let pollTimer = null;
let allTurns = [];
let nextCursor = null;
let hasMore = false;
let filterMode = 'all'; // 'all', 'changes', 'major', 'semantic', 'slow', 'aborted'
let customThreshold = 0.0;
let fetchAbortController = null;

function isMomentEligible(turn) {
  if (turn.is_moment !== undefined) return Boolean(turn.is_moment);
  return Boolean(turn.has_delta || turn.has_semantic_event || turn.has_slow_write || turn.is_aborted);
}

function setFilterMode(mode) {
  filterMode = mode;
  document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
  if (mode === 'all') {
    document.getElementById('btn-filter-all').classList.add('active');
    customThreshold = 0.0;
  } else if (mode === 'changes') {
    document.getElementById('btn-filter-changes').classList.add('active');
    customThreshold = 0.0001;
  } else if (mode === 'major') {
    document.getElementById('btn-filter-major').classList.add('active');
    customThreshold = 0.05;
  } else if (mode === 'semantic') {
    document.getElementById('btn-filter-semantic').classList.add('active');
  } else if (mode === 'slow') {
    document.getElementById('btn-filter-slow').classList.add('active');
  } else if (mode === 'aborted') {
    document.getElementById('btn-filter-aborted').classList.add('active');
  }
  document.getElementById('threshold-input').value = customThreshold.toFixed(2);
  renderFeed();
}

function onThresholdChange(val) {
  const v = parseFloat(val);
  customThreshold = isNaN(v) ? 0.0 : Math.max(0, v);
  document.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
  renderFeed();
}

function renderFeed() {
  const container = document.getElementById('moments-list');
  const filtered = allTurns.filter(turn => {
    // 1. Mandatory factual Moments Inclusion: ANY of the 4 must be true
    if (!isMomentEligible(turn)) {
      return false; // Ordinary zero-delta semantic-abstain turn does not appear
    }

    // 2. Mode-specific filters
    if (filterMode === 'slow') {
      return turn.has_slow_write === true;
    }
    if (filterMode === 'semantic') {
      return turn.has_semantic_event === true;
    }
    if (filterMode === 'aborted') {
      return turn.is_aborted === true;
    }
    if (filterMode === 'changes') {
      return turn.has_delta === true;
    }
    if (filterMode === 'major') {
      return (turn.max_abs_delta || 0) >= 0.05;
    }
    const maxDelta = turn.max_abs_delta !== undefined ? turn.max_abs_delta : (turn.has_delta ? 0.01 : 0.0);
    return maxDelta >= customThreshold;
  });

  document.getElementById('visible-count').textContent = filtered.length;
  document.getElementById('total-loaded').textContent = allTurns.length;

  if (filtered.length === 0) {
    container.innerHTML = '<div class="card"><div class="empty">当前筛选条件下暂无记录。</div></div>';
    return;
  }

  let html = '';
  filtered.forEach(turn => {
    const timeStr = OWDisplay.fmtTime(turn.committed_at);
    const isAborted = turn.is_aborted === true;
    const hasDelta = turn.has_delta === true;
    const hasSlow = turn.has_slow_write === true;
    const hasSemantic = turn.has_semantic_event === true;

    let badgeHtml = '';
    if (isAborted) {
      badgeHtml += '<span class="badge-aborted" style="background:#490202; color:#fff; border:1px solid var(--red); font-family:var(--mono); font-size:10px; padding:1px 6px; border-radius:3px; font-weight:600;">已中止</span> ';
    }
    if (hasSlow) {
      badgeHtml += '<span class="badge-slow" title="SLOW WRITE">慢状态写入</span> ';
    }
    if (hasSemantic) {
      badgeHtml += '<span class="badge-semantic" style="background:#0c2d48; color:#58a6ff; border:1px solid #1f5080; font-family:var(--mono); font-size:10px; padding:1px 6px; border-radius:3px;" title="SEMANTIC EVENT">语义事件</span> ';
    }
    if (hasDelta) {
      badgeHtml += '<span class="badge-delta" title="FAST AFFECT">快状态Δ</span> ';
    } else if (!isAborted) {
      badgeHtml += '<span class="badge-no-delta" title="NO DELTA">无变化</span> ';
    }

    let deltaHtml = '';
    if (isAborted) {
      deltaHtml = `<span style="color:var(--red); font-weight:600;">已中止 — 无规范化状态变化</span>`;
    } else {
      deltaHtml = `<span style="color:${hasDelta ? 'var(--text)' : 'var(--dim)'}; font-weight:500;">${turn.delta_summary ? OWDisplay.displayDimensionText(turn.delta_summary) : '无变化'}</span>`;
    }

    html += `
      <div class="moment-card" style="${isAborted ? 'border-left: 3px solid var(--red);' : ''}">
        <div class="moment-meta">
          <div style="display:flex; align-items:center; gap:8px;">
            <span style="color:var(--text); font-weight:600;">${timeStr}</span>
            <span class="dim">·</span>
            <span class="dim" style="font-size:11px;">轮次 ${turn.interaction_id}</span>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <div>${badgeHtml}</div>
            <a href="${OWRuntimeScope.withRuntime('/debug/causal?turn_id=' + encodeURIComponent(turn.interaction_id), runtimeSelection)}" class="btn" style="background:var(--accent-soft); border:1px solid transparent; color:var(--accent); text-decoration:none; padding:3px 10px; border-radius:6px; font-size:12px; font-weight:500; white-space:nowrap;">查看因果链 →</a>
          </div>
        </div>
        <div class="moment-user">用户："${turn.user_preview || '—'}"</div>
        <div style="display:flex; justify-content:space-between; align-items:center; font-family:var(--mono); font-size:11px;">
          <div>
            <span class="dim">状态变化：</span>
            ${deltaHtml}
          </div>
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
}

async function fetchTurns(cursor = null, isInitial = false) {
  if (fetchAbortController) fetchAbortController.abort();
  fetchAbortController = new AbortController();

  let url = '/api/turns?limit=20';
  if (cursor) {
    url += '&before=' + encodeURIComponent(cursor);
  }

  try {
    const data = await OWRuntimeScope.runtimeFetch(runtimeSelection, url, { signal: fetchAbortController.signal });
    const fetched = data.turns || [];

    if (isInitial) {
      allTurns = fetched;
    } else {
      // Keyset append ensuring uniqueness
      const existingIds = new Set(allTurns.map(t => t.interaction_id));
      fetched.forEach(t => {
        if (!existingIds.has(t.interaction_id)) {
          allTurns.push(t);
        }
      });
    }

    nextCursor = data.next_cursor;
    hasMore = data.has_more;
    document.getElementById('pagination-box').style.display = hasMore ? 'block' : 'none';

    renderFeed();
    document.getElementById('dot').className = 'conn-dot ok';
    document.getElementById('live-badge').className = '';
  } catch (e) {
    if (e.name !== 'AbortError') {
      if (runtimeSelection.mode === 'SCOPED' && (e.code === 'UNKNOWN_BINDING' || e.code === 'BINDING_REGISTRY_UNAVAILABLE' || e.code === 'BINDING_UNAVAILABLE' || e.code === 'RUNTIME_IDENTITY_MISMATCH')) {
        stopPolling();
        OWRuntimeScope.renderRuntimeError(document.querySelector('.layout'), e.code, e.message, runtimeSelection.bindingId);
        return;
      }
      document.getElementById('dot').className = 'conn-dot err';
      document.getElementById('live-badge').className = 'disconnected';
      document.getElementById('live-badge').textContent = 'DISCONNECTED';
    }
  }
}

async function loadMore() {
  if (nextCursor && hasMore) {
    await fetchTurns(nextCursor, false);
  }
}

function manualRefresh() {
  fetchTurns(null, true);
}

function startPolling() {
  stopPolling();
  if (runtimeSelection.mode === 'INVALID') return;
  pollTimer = setInterval(() => {
    if (isPageActive && allTurns.length > 0) {
      // Background head poll
      OWRuntimeScope.runtimeFetch(runtimeSelection, '/api/turns?limit=5')
        .then(data => {
          const fresh = data.turns || [];
          const existingIds = new Set(allTurns.map(t => t.interaction_id));
          const newTurns = fresh.filter(t => !existingIds.has(t.interaction_id));
          if (newTurns.length > 0) {
            allTurns = [...newTurns, ...allTurns];
            renderFeed();
          }
        })
        .catch(e => {
          if (runtimeSelection.mode === 'SCOPED' && (e.code === 'UNKNOWN_BINDING' || e.code === 'BINDING_REGISTRY_UNAVAILABLE' || e.code === 'BINDING_UNAVAILABLE' || e.code === 'RUNTIME_IDENTITY_MISMATCH')) {
            stopPolling();
            OWRuntimeScope.renderRuntimeError(document.querySelector('.layout'), e.code, e.message, runtimeSelection.bindingId);
          }
        });
    }
  }, 30000); // 30-second interval
}

function stopPolling() {
  if (pollTimer) {
    clearInterval(pollTimer);
    pollTimer = null;
  }
}

// Clock tick
setInterval(() => {
  const d = new Date();
  document.getElementById("clock").textContent = d.toISOString().slice(11, 19);
}, 1000);

// Page lifecycle hygiene
window.addEventListener("pagehide", () => {
  isPageActive = false;
  stopPolling();
  if (fetchAbortController) fetchAbortController.abort();
});
window.addEventListener("beforeunload", () => {
  isPageActive = false;
  stopPolling();
  if (fetchAbortController) fetchAbortController.abort();
});
window.addEventListener("pageshow", () => {
  isPageActive = true;
  if (runtimeSelection.mode !== "INVALID") {
    fetchTurns(null, true);
    startPolling();
  }
});

// Debug dropdown: click toggles, outside click / Escape closes (hover also works via CSS)
(function () {
  const dd = document.querySelector(".nav-dropdown");
  if (!dd) return;
  dd.querySelector(".nav-dropdown-toggle").addEventListener("click", (e) => {
    e.stopPropagation();
    dd.classList.toggle("open");
  });
  document.addEventListener("click", (e) => {
    if (!dd.contains(e.target)) dd.classList.remove("open");
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") dd.classList.remove("open");
  });
})();

if (runtimeSelection.mode === "INVALID") {
  OWRuntimeScope.renderRuntimeError(document.querySelector(".layout"), "INVALID", runtimeSelection.detail, null);
} else {
  fetchTurns(null, true);
  startPolling();
}
</script>
</body>
</html>
